apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  namespace: default
  labels:
    app: heart-disease-api
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-disease-api
  template:
    metadata:
      labels:
        app: heart-disease-api
    spec:
      containers:
        - name: heart-disease-api
          image: GCR_IMAGE_PLACEHOLDER   # replaced by CI/CD
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: gcp-secrets
                  key: project_id
                  optional: true        # Don't crash if secret missing
          resources:
            requests:
              cpu: "100m"               # Lowered for GKE Autopilot scheduling
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          # Give the app 60s to start (model loading + uvicorn startup)
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 10
      terminationGracePeriodSeconds: 30
