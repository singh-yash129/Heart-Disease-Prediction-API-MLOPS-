name: CI/CD — Build, Push & Deploy to GKE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION:   us-central1
  GKE_CLUSTER:  heart-disease-cluster
  IMAGE_NAME:   heart-disease-api
  REGISTRY:     gcr.io

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build & Push Docker image using WIF (no service account keys)
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token:  write    # Required for WIF

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Workload Identity Federation (WIF) — no service account keys ───────
      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account:           ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format:              access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ── Login to GCR using the WIF access token ─────────────────────────────
      - name: Login to GCR via Docker
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # ── Build & Push ────────────────────────────────────────────────────────
      - name: Set image tags
        id: meta
        run: |
          SHA_TAG="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest"
          echo "sha_tag=${SHA_TAG}"       >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "SHA_TAG=${SHA_TAG}"       >> $GITHUB_ENV
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            --tag "${SHA_TAG}" \
            --tag "${LATEST_TAG}" \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Push Docker image to GCR
        run: |
          docker push "${SHA_TAG}"
          docker push "${LATEST_TAG}"
          echo "✅ Pushed: ${SHA_TAG}"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy to GKE
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token:  write    # Required for WIF

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── WIF Auth ─────────────────────────────────────────────────────────────
      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account:           ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format:              access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # ── Create K8s secret for GCP project ID ───────────────────────────────
      - name: Create K8s secret
        run: |
          kubectl create secret generic gcp-secrets \
            --from-literal=project_id="${{ secrets.GCP_PROJECT_ID }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Substitute image in deployment manifest ─────────────────────────────
      - name: Set image in deployment manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sed -i "s|GCR_IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/deployment.yaml
          echo "✅ Image → ${IMAGE}"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          echo "⏳ Waiting up to 10 minutes for rollout (GKE Autopilot needs time to provision nodes)..."
          kubectl rollout status deployment/heart-disease-api --timeout=600s

      - name: Verify deployment
        run: |
          echo "=== Pods ===" && kubectl get pods -l app=heart-disease-api
          echo "=== Service ===" && kubectl get svc heart-disease-api-svc
          echo "=== HPA (max 3) ===" && kubectl get hpa heart-disease-api-hpa

      - name: Get External IP
        run: |
          echo "⏳ Waiting for External IP..."
          for i in {1..20}; do
            IP=$(kubectl get svc heart-disease-api-svc \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "${IP}" ]; then
              echo "✅ External IP: ${IP}"
              echo "   API: http://${IP}/predict"
              echo "   Docs: http://${IP}/docs"
              break
            fi
            echo "   Attempt ${i}/20 — waiting 15s..." && sleep 15
          done
